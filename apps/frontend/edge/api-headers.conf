# Header API edge Foundation (spec 0012, Header API): setiap jawaban HTTPS /api/, dari backend maupun dari edge. Di
# include pada location /api/ dan pada setiap named location galatnya. Cache-Control jawaban backend diteruskan apa
# adanya; jawaban yang dibuat edge sendiri menambah Cache-Control: no-store di named location galat.
add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Request-Id $request_id always;
