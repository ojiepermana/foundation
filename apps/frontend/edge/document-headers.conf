# Header dokumen edge Foundation (spec 0012, tabel Header dokumen): setiap jawaban HTTPS di luar /api/. Di include pada
# level server HTTPS (untuk galat yang dibuat nginx sebelum location dipilih) dan pada setiap location non API yang
# mempunyai add_header sendiri, karena nginx tidak mewarisi add_header ke location seperti itu. Nilai CSP sudah final;
# perubahan hanya lewat pembaruan spec 0012 dengan alasan tertulis.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; require-trusted-types-for 'script'; trusted-types angular angular#bundler angular#components" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header X-Request-Id $request_id always;
