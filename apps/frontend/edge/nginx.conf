# Konfigurasi edge Foundation (spec 0012, tabel Konfigurasi edge). Edge melayani build production Angular dari
# /srv/frontend, mengakhiri TLS pada port container 8443, dan meneruskan path berawalan /api/ ke backend. Perilaku yang
# tidak ditulis di sini mengikuti default nginx 1.30.5. Proses berjalan sebagai UID 101 dengan root filesystem hanya
# baca; semua file sementara berada di /tmp/nginx (tmpfs), yang dibuat foundation-edge.
worker_processes 1;
pid /tmp/nginx/nginx.pid;
error_log stderr crit;

events {
  worker_connections 1024;
}

http {
  # Tanpa mime.types, main-*.js dan styles-*.css dilayani text/plain dan ditolak browser.
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;

  client_body_temp_path /tmp/nginx/client_body;
  proxy_temp_path /tmp/nginx/proxy;
  fastcgi_temp_path /tmp/nginx/fastcgi;
  uwsgi_temp_path /tmp/nginx/uwsgi;
  scgi_temp_path /tmp/nginx/scgi;

  # Bagian path $request_uri sebelum ?, tanpa decode: dipakai log dan penolakan traversal, tidak pernah query string.
  map $request_uri $foundation_path {
    "~^(?<p>[^?]*)" $p;
  }

  # AC-7: path /api/ yang memuat segmen . atau .., %2e, %2f, atau %5c (huruf besar atau kecil), atau karakter \,
  # ditolak 400 tanpa diteruskan. Hanya path yang diperiksa, sehingga ?returnUrl=%2Fhome tetap diteruskan.
  map $foundation_path $foundation_bad_path {
    default 0;
    "~(^|/)\.\.?(/|$)" 1;
    "~*%2e" 1;
    "~*%2f" 1;
    "~*%5c" 1;
    "~\\\\" 1;
  }

  # $status selalu tiga digit, sehingga request yang diakhiri nginx tanpa jawaban (misalnya stream HTTP/2 dengan header
  # di atas large_client_header_buffers) tercatat 000. JSON melarang nol di depan angka, jadi nol di depan dibuang dan
  # 000 menjadi 0 (rationale spec 0012, keputusan 57).
  map $status $foundation_status {
    "~^0*(?<foundation_status_digits>[0-9]+)$" $foundation_status_digits;
    default 0;
  }

  # Tabel Cache dan fallback baris aset ber hash: hanya aset yang ada (200, 206, atau 304 yang memvalidasinya) disimpan
  # setahun. 404 untuk nama aset ber hash yang tidak ada, dan status lain, divalidasi ulang, sehingga 404 yang diminta
  # selama pergantian versi tidak tersimpan setahun di browser atau cache bersama (rationale spec 0012, keputusan 68).
  map $status $foundation_asset_cache {
    default "no-cache";
    200 "public, max-age=31536000, immutable";
    206 "public, max-age=31536000, immutable";
    304 "public, max-age=31536000, immutable";
  }

  # Log akses satu objek JSON per baris tanpa IP client, user agent, referer, query string, header, cookie, atau body.
  # Nilai string dikutip; status, bytes, dan requestTime berupa angka. Variable upstream yang tidak ada menjadi string
  # kosong.
  log_format foundation escape=json '{"time":"$time_iso8601","requestId":"$request_id","method":"$request_method","path":"$foundation_path","status":$foundation_status,"bytes":$body_bytes_sent,"requestTime":$request_time,"upstreamStatus":"$upstream_status","upstreamTime":"$upstream_response_time"}';
  access_log /dev/stdout foundation;

  # Batas body sama dengan maxRequestBodySize: 1024 di apps/backend/src/index.ts; keduanya hanya berubah bersama.
  client_max_body_size 1k;
  client_header_timeout 10s;
  client_body_timeout 10s;
  send_timeout 10s;
  keepalive_timeout 15s;
  large_client_header_buffers 4 8k;
  proxy_connect_timeout 3s;
  proxy_send_timeout 10s;
  proxy_read_timeout 10s;

  # foundation-edge menulis resolver Docker dan server <FOUNDATION_BACKEND_UPSTREAM> resolve, sehingga nama backend
  # diresolusi ulang paling lama setiap 10 detik tanpa restart edge.
  upstream backend {
    zone backend 64k;
    include /tmp/nginx/upstream.conf;
  }

  # HTTP hanya mengalihkan ke HTTPS untuk setiap method dan path, tanpa meneruskan apa pun dan tanpa HSTS. $host tidak
  # membawa port dan berasal dari header Host client; topologi rujukan mengasumsikan HTTPS publik pada port 443.
  # 308 dapat disimpan cache secara bawaan, dan tujuannya memantulkan Host client sampai server_name ditetapkan, jadi
  # jawaban ini tidak pernah disimpan cache (rationale spec 0012, keputusan 67).
  server {
    listen 8080 default_server;
    add_header Cache-Control "no-store" always;
    return 308 https://$host$request_uri;
  }

  server {
    listen 8443 ssl default_server;
    http2 on;
    ssl_certificate /run/secrets/edge_tls_cert;
    ssl_certificate_key /run/secrets/edge_tls_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;

    root /srv/frontend;

    # Berlaku untuk galat yang dibuat nginx sebelum location dipilih (request line atau header melebihi
    # large_client_header_buffers, atau path yang naik di atas root seperti /api/../../x). Setiap location di bawah
    # mempunyai add_header sendiri dan meng include header nya.
    include /etc/nginx/foundation/document-headers.conf;

    # ^~ membuat location regex tidak pernah dicek untuk path /api/. URI asli diteruskan apa adanya.
    location ^~ /api/ {
      include /etc/nginx/foundation/api-headers.conf;
      error_page 400 @api_bad_request;
      error_page 413 @api_payload_too_large;
      error_page 502 @api_bad_gateway;
      error_page 504 @api_gateway_timeout;

      if ($foundation_bad_path) {
        return 400;
      }

      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      # Correlation ID dari client tidak dipercaya: nilai edge menimpa header yang sama dari client.
      proxy_set_header X-Request-Id $request_id;
      proxy_hide_header X-Request-Id;
      # Header alamat client (spec 0012): nilai kosong membuat nginx tidak mengirim header itu ke backend.
      proxy_set_header X-Forwarded-For "";
      proxy_set_header X-Forwarded-Host "";
      proxy_set_header X-Forwarded-Proto "";
      proxy_set_header X-Forwarded-Port "";
      proxy_set_header X-Forwarded-Prefix "";
      proxy_set_header X-Original-Forwarded-For "";
      proxy_set_header X-Real-IP "";
      proxy_set_header X-Client-IP "";
      proxy_set_header True-Client-IP "";
      proxy_set_header CF-Connecting-IP "";
      proxy_set_header Fastly-Client-IP "";
      proxy_set_header X-Cluster-Client-IP "";
      proxy_set_header Forwarded "";
    }

    # Jawaban JSON yang dibuat edge sendiri untuk /api/. types kosong membuat Content-Type selalu default_type,
    # termasuk untuk path berekstensi seperti /api/x.css.
    location @api_bad_request {
      include /etc/nginx/foundation/api-headers.conf;
      add_header Cache-Control "no-store" always;
      types { }
      default_type application/json;
      return 400 '{"error":"Invalid request"}';
    }

    location @api_payload_too_large {
      include /etc/nginx/foundation/api-headers.conf;
      add_header Cache-Control "no-store" always;
      types { }
      default_type application/json;
      return 413 '{"error":"Payload too large"}';
    }

    location @api_bad_gateway {
      include /etc/nginx/foundation/api-headers.conf;
      add_header Cache-Control "no-store" always;
      types { }
      default_type application/json;
      return 502 '{"error":"Bad gateway"}';
    }

    location @api_gateway_timeout {
      include /etc/nginx/foundation/api-headers.conf;
      add_header Cache-Control "no-store" always;
      types { }
      default_type application/json;
      return 504 '{"error":"Gateway timeout"}';
    }

    # Tabel Cache dan fallback: aset ber hash yang ada disimpan setahun dan 404 nya divalidasi ulang ($foundation_asset_cache);
    # file berekstensi lain dan index.html divalidasi ulang.
    location ~ "^/(main|chunk|styles|polyfills)-[A-Za-z0-9_-]{8}\.(js|css)$" {
      include /etc/nginx/foundation/document-headers.conf;
      add_header Cache-Control $foundation_asset_cache always;
      try_files $uri =404;
    }

    location ~ "\.[A-Za-z0-9]+$" {
      include /etc/nginx/foundation/document-headers.conf;
      add_header Cache-Control "no-cache" always;
      try_files $uri =404;
    }

    # Path yang segmen terakhirnya tanpa ekstensi, termasuk / dan /kesiapan, mendapat index.html dengan status 200.
    # /api tanpa garis miring akhir berada di luar /api/: tanpa location tepat ini nginx menjawabnya 301 ke /api/ dengan
    # port container dan tanpa Header dokumen, karena location ^~ /api/ memakai proxy_pass.
    location = /api {
      include /etc/nginx/foundation/document-headers.conf;
      add_header Cache-Control "no-cache" always;
      try_files $uri /index.html;
    }

    location / {
      include /etc/nginx/foundation/document-headers.conf;
      add_header Cache-Control "no-cache" always;
      try_files $uri /index.html;
    }
  }
}
